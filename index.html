<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LGS Rehber Robotu</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--mut:#6b7488;--pri:#3b5bdb;--me:#3b5bdb;--bot:#eef1f9;--bd:#dfe4ef}
@media(prefers-color-scheme:dark){:root{--bg:#121622;--card:#1b2132;--ink:#e8ecf6;--mut:#98a2b8;--pri:#6c8cff;--me:#4a67d6;--bot:#252c42;--bd:#2d3550}}
*{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{height:100%;margin:0}
body{font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
header .bot{font-size:28px}header b{display:block}header small{color:var(--mut)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px}
button.p{background:var(--pri);border-color:var(--pri);color:#fff}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
#chat{display:flex;flex:1;min-height:0;flex-direction:column}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:820px;width:100%;margin:0 auto}
.m{max-width:88%;padding:10px 14px;border-radius:16px;word-wrap:break-word;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.m.b{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.m.b p{margin:.3em 0}.m.b ul{margin:.3em 0;padding-left:1.2em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font-size:14px;border-radius:999px}
#bar{border-top:1px solid var(--bd);background:var(--card);padding:10px}
#bar div{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
#bar textarea{resize:none;max-height:140px}
.dots span{animation:b 1s infinite;display:inline-block}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes b{50%{opacity:.2}}
</style>
</head><body>
<header><span class="bot">🤖</span><div><b>LGS Rehber Robotu</b><small>Aklındaki her soruyu sorabilirsin</small></div></header>
<section id="chat"><div id="msgs"></div>
<div id="bar"><div><textarea id="in" rows="1" placeholder="Sorunu yaz… (Enter ile gönder)"></textarea><button class="p" id="send">Gönder</button></div></div></section>
<script>
const $=s=>document.querySelector(s);
const SYS=`Sen "LGS Rehber Robotu"sun: bir ortaokul (özellikle 8. sınıf) öğrencisinin yanında duran, sabırlı, samimi, bilgili ve güvenilir dijital rehber öğretmen ve koç asistanısın. Türkçe konuş. Basit soruya kısa, zor soruya ayrıntılı cevap ver. Gerektiğinde madde işareti ve **kalın** kullan. Kalıp cevaplar verme; öğrencinin sorusuna ve seviyesine göre özgün, insan gibi cevap üret.

GÖREVLERİN: (1) HER dersten (Türkçe, Matematik, Fen, İnkılap, Din, İngilizce ve diğerleri) soruları cevapla: konuyu anlat, adım adım çöz, benzer mini soru ver; ödevde yalnızca sonucu verme, yöntemi öğret; öğrenci cevabını yazarsa kontrol et. (2) Öğrenci deneme netlerini yazarsa güçlü/zayıf dersleri, gidişatı, öncelikleri yorumla; haftalık plan ve konu sırası öner. (3) Çalışma yöntemleri: aktif hatırlama, aralıklı tekrar (1-3-7-30 gün), Feynman tekniği, Pomodoro, yanlış defteri, deneme analizi (bilgi/dikkat/süre hatası), süre yönetimi, paragraf ve problem teknikleri, sınav günü stratejisi. (4) Rehberlik: motivasyon, sınav kaygısı, erteleme, telefon/oyun dengesi, uyku-beslenme-hareket, aile baskısı, arkadaşlık, zorbalık, özgüven, ilgi ve yeteneğe göre alan/meslek yönlendirmesi. (5) Tercih: Anadolu, Fen, Sosyal Bilimler, Spor, Güzel Sanatlar, İmam Hatip, Mesleki ve Teknik liseleri; yüzdelik dilim ve taban puan mantığı; hedef/orta/güvenli okul dengesi.

LGS: 90 soru (Türkçe 20, Matematik 20, Fen 20, İnkılap 10, Din 10, Yabancı Dil 10), iki oturum (Sözel: Türkçe, İnkılap, Din, Yabancı Dil; Sayısal: Matematik, Fen), 4 yanlış 1 doğruyu götürür, puan 500 üzerinden, Türkçe-Matematik-Fen katsayısı 4, diğerleri 1.

KURALLAR: Güncel ve değişken bilgilerde (sınav tarihi, kontenjan, taban puan, burs, müfredat değişikliği) kesin rakam veya tarih UYDURMA; lgs.meb.gov.tr, meb.gov.tr ve rehber öğretmene yönlendir. Emin olmadığın şeyi uydurma. Cevap anahtarı veya sınav sırasında kopya yardımı verme. Kendine zarar verme, çaresizlik, istismar, zorbalık veya tehlike belirtisinde: sakin ve sevecen ol, yalnız olmadığını söyle, güvendiği bir yetişkine ve rehber öğretmenine hemen söylemesini iste, acil tehlikede 112'yi söyle ve konuyu ders planına çevirme. Uygunsuz isteklerde nazikçe reddet. Tıbbi tanı, ilaç, hukuki konularda yalnızca genel bilgi ver. Uygunsa cevabın sonunda tek bir somut sonraki adım öner.`;
let hist=[],busy=false,sample=null;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function md(t){
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");
  let out="",ul=false;
  for(const l of t.split("\n")){
    const li=l.match(/^\s*[-*•]\s+(.*)/)||l.match(/^\s*\d+[.)]\s+(.*)/);
    if(li){if(!ul){out+="<ul>";ul=true}out+="<li>"+inl(li[1])+"</li>"}
    else{if(ul){out+="</ul>";ul=false}if(l.trim())out+="<p>"+inl(l.replace(/^#+\s*/,""))+"</p>"}
  }
  return out+(ul?"</ul>":"");
}
function add(cls,html){const d=document.createElement("div");d.className="m "+cls;d.innerHTML=html;$("#msgs").appendChild(d);d.scrollIntoView({block:"end"});return d}
function chips(list){
  const d=document.createElement("div");d.className="chips";
  list.forEach(q=>{const b=document.createElement("button");b.textContent=q;b.onclick=()=>{d.remove();ask(q)};d.appendChild(b)});
  $("#msgs").appendChild(d);
}
add("b","<p>Merhaba! Ben LGS Rehber Robotu’yum. 👋</p><p>Ders sorularını çözebilir, deneme netlerini yorumlayabilir, çalışma planı çıkarabilir, tercih ve sınav tekniği konusunda öneri verebilirim. Deneme netlerini yazarsan yorumlarım. Neyle başlayalım?</p>");
chips(["Bu hafta için çalışma planı yap","Netlerimi yazayım, yorumlar mısın?","Sınav kaygısıyla nasıl başa çıkarım?","Yanlış defteri nasıl tutulur?","Tercih yaparken nelere bakmalıyım?","Bana bir konu anlat"]);
(async()=>{try{sample=await claude.use("sample")}catch(e){sample=null}})();
async function ask(text){
  text=text.trim();if(!text||busy)return;busy=true;
  add("u",esc(text));hist.push({role:"user",content:text});$("#in").value="";$("#in").style.height="auto";
  const w=add("b",'<span class="dots"><span>●</span><span>●</span><span>●</span></span>');
  try{
    if(!sample)sample=await claude.use("sample");
    if(!sample)throw {message:"Claude bağlantısı kurulamadı. Bu sayfayı claude.ai üzerinden açtığından ve izin verdiğinden emin ol."};
    const h=hist.slice(-16).map(m=>({...m}));
    h[0].content="[TALİMAT]\n"+SYS+"\n[/TALİMAT]\n\nÖğrenci mesajı:\n"+h[0].content;
    const r=await sample(h,{cache:false,modelTier:"default",onText:({text:t})=>{w.innerHTML=md(t);w.scrollIntoView({block:"end"})}});
    hist.push({role:"assistant",content:r.text});w.innerHTML=md(r.text);
  }catch(e){hist.pop();w.innerHTML="<p>⚠️ "+esc(e.code==="rate_limited"?"Çok hızlı gittik, birkaç saniye sonra tekrar dene.":e.code==="not_granted"?"Robotun çalışması için izin vermen gerekiyor. Sayfayı yenileyip izni onayla.":(e.message||"Bir hata oluştu"))+"</p>"}
  busy=false;w.scrollIntoView({block:"end"});
}
$("#send").onclick=()=>ask($("#in").value);
$("#in").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask($("#in").value)}});
$("#in").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px"});
</script></body></html>
